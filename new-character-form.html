<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <style>
        .chrome-color {
            background: linear-gradient(180deg, #A8A9AD 30%, #5E6674 75%, #A1A2A5 100%);
        }
    </style>

    <title>Add a Character | Marvel Character Gallery</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg chrome-color">
        <div class="container-fluid">
            <a class="navbar-brand link-light fw-bold" href="index.html">
                <img src="resources/images/Marvel logo.png" alt="Marvel Logo" width="75" height="34"
                    style="padding-bottom: 4px;">
                Character Gallery</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link link-light" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link link-light" href="details.html">Details</a></li>
                    <li class="nav-item"><a class="nav-link link-light" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active link-light" aria-current="page"
                            href="new-character-form.html">Add a Character</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- End Header -->

    <main class="container py-5 flex-grow-1">
        <h1 class="text-center fw-bold mb-2">Add a Character</h1>
        <p class="text-center text-muted mb-4">Enter details for a character to add to the gallery.</p>

        <form class="mx-auto" style="max-width: 700px;">
            <div class="mb-3">
                <label for="character-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="character-name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="character-universe" class="form-label">Universe</label>
                <input type="text" class="form-control" id="character-universe" name="universe" required>
            </div>
            <div class="mb-3">
                <label for="character-role" class="form-label">Role</label>
                <input type="text" class="form-control" id="character-role" name="role" required>
            </div>
            <div class="mb-3">
                <label for="character-image" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="character-image" name="image-url"
                    placeholder="https://example.com/image.jpg">
            </div>
            <div class="mb-3">
                <label for="character-description" class="form-label">Short Description</label>
                <textarea class="form-control" id="character-description" name="description" rows="4"
                    required></textarea>
            </div>
            <button type="submit" class="btn btn-danger">Add Character</button>
        </form>
    </main>

    <footer class="text-white text-center chrome-color py-4">
        <p class="mb-0">© 2026 Marvel Character Gallery. Created by Abdul Rehman.</p>
    </footer>

</body>

</html>
